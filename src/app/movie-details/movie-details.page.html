<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>G00485482</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2 style="text-align: center" class="page-title">"{{ movie?.title }}" Details</h2>
<ion-card *ngIf="movie">
  <img alt="Movie Poster" [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" />

  <ion-card-header><ion-card-title>{{ movie.title }}</ion-card-title></ion-card-header>

  <ion-card-content>
    <p>Release Date: {{ movie.release_date }}</p>
    <p>Rating: {{ movie.vote_average | number: '1.0-1' }}/10</p>
    <p>{{ movie.overview }}</p>
  </ion-card-content>
</ion-card>

<h2 class="page-title">Cast</h2>
<ion-card *ngFor="let actor of cast">

    <img *ngIf="actor.profile_path" [src]="'https://image.tmdb.org/t/p/w200'+actor.profile_path" />

    <ion-card-content>
      <p><strong style="font-size: medium">"{{ actor.character }}"</strong></p>
      <p>{{ actor.name }}</p>
    </ion-card-content>

</ion-card>

<h2 class="page-title">Crew</h2>
<ion-card *ngFor="let member of crew">

  <img *ngIf="member.profile_path" [src]="'https://image.tmdb.org/t/p/w200'+member.profile_path" />

  <ion-card-content>
    <p><strong style="font-size: medium">{{ member.job }}</strong></p>
    <p>{{ member.name }}</p>
  </ion-card-content>

</ion-card>
</ion-content>
